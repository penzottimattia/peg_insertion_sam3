main_camera_serial: "ENTER_MAIN_SERIAL"
# Optional. Omit or set to null for main-camera-only datasets.
secondary_camera_serial: null

sam3:
  gpus: [0]
  checkpoint_path: null
  bpe_path: null
  output_probability_threshold: 0.45
  offload_video_to_cpu: true
  offload_state_to_cpu: true
  jpeg_quality: 95

text_prompts:
  main:
    peg: "the insertion peg"
    holder: "the peg holder"  # optional
    hand: "the hand holding the peg"  # optional; enables axial slip
  # Optional, used only when secondary_camera_serial is configured.
  secondary:
    peg: "the insertion peg"
    holder: "the peg holder"  # optional
    hand: "the hand holding the peg"  # optional; enables lateral slip

instance_selection:
  peg: largest
  holder: largest
  hand: largest

dimensions:
  peg_length_mm: null
  peg_width_mm: null

onset:
  pre_window_frames: 5
  gap_mad_multiplier: 8.0
  gap_nominal_multiplier: 3.0

tracking:
  min_mask_area_px: 20
  holder_origin: fixed_t0

visualization:
  keyframes: 12
  density_bins: 180
  density_sigma: 2.0
